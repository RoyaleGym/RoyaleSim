[package]
name = "royalesim"
version = "0.1.10"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[lib]
name = "royalesim"
# cdylib: the Python extension. rlib: so benches/tests and other crates can link it.
crate-type = ["cdylib", "rlib"]

[features]
# CHECKOUT DATA: read data/derived/cards.json from the checkout this crate was built in, at run time, when it exists.
# On for every build from a checkout (cargo test, maturin develop, the gate), so a regenerated card table is picked up
# without a rebuild. OFF for a wheel (`maturin build --no-default-features`, .github/workflows/wheels.yml): a wheel
# runs only its compiled-in table, and never a file at a path from the machine that built it.
default = ["checkout-data"]
checkout-data = []

[dependencies]
# abi3-py310: one wheel per platform runs on CPython 3.10 and every later version (the stable ABI).
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The determinism profile. Overflow checks stay ON in release, because in an
# integer engine a silent wrap is a silently wrong battle that no test will
# attribute to the right cause. The cost is a few percent; the alternative is
# the class of bug this project cannot afford.
[profile.release.package.royalesim]
overflow-checks = true

# The TEST GATE's profile (`cargo test --profile gate`): the release optimisation and the overflow checks, without the
# fat link. Fat LTO with one codegen unit is for the shipped wheel and exe; every test binary paying for it made the
# full suite take 45 to 87 minutes. An integer engine's results do not depend on how it is linked, and the gate's own
# hash_continuity check would show it if they did.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16

[profile.gate.package.royalesim]
overflow-checks = true

[profile.bench]
inherits = "release"
