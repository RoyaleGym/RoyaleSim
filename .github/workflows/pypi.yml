name: pypi
# Publishes a release's files to PyPI: exactly the wheels and sdist already on the GitHub Release, which the wheels
# workflow built and tested in clean venvs. Nothing is rebuilt here.
#
# Two ways in:
#   - after the wheels workflow succeeds for a v* tag (workflow_run). A release made with the workflow token does not
#     start other workflows, so `on: release` would never fire for releases the wheels workflow creates;
#   - by hand, with the tag to publish (workflow_dispatch): for a release made before this file existed.
#
# AUTOMATIC (owner's ruling, 2026-10-04: "automate"). A v* tag publishes once the wheels workflow has passed for it:
# that success, every wheel tested in a clean venv and the sdist checked, is the gate. The job runs in the `pypi`
# environment without a per-run approval and publishes through PyPI's trusted publishing (OIDC): no token is stored
# anywhere. PyPI's trusted publisher for royalesim names this repository, this file (pypi.yml) and the environment
# `pypi`. A release PyPI already holds is never overwritten: PyPI refuses a file name it has seen.
on:
  workflow_run:
    workflows: [wheels]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, for example v0.1.1
        required: true

jobs:
  publish:
    # The owner's switch: nothing runs unless the repository variable PYPI_PUBLISH is "true" (set 2026-10-04). A job
    # naming an environment that does not exist yet would make GitHub create it unconfigured, so the switch stays as
    # the one place to turn publishing off.
    if: >-
      vars.PYPI_PUBLISH == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: download the release's files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist
          # Every file must carry the tag's version, so a stray file can never be uploaded under another release.
          version="${TAG#v}"
          for f in dist/*; do
            case "$(basename "$f")" in
              royalesim-"$version"-*.whl|royalesim-"$version".tar.gz) ;;
              *) echo "refusing $f: not royalesim $version"; exit 1 ;;
            esac
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
