name: cross-repo
# ONE ENGINE, MANY CONSUMERS. This is the only job in the family that can see BINARY AHEAD OF
# CALLERS: the failure where the extension is rebuilt, everything looks installed, and every
# downstream repo raises on contact. That happened at 22:49 on 2026-09-22 and cost every repo
# on the machine half an hour, discovered by someone tripping over it rather than being told.
#
# WHY IT BUILDS ONCE AND SHARES THE WHEEL, rather than taking a command from each caller. A
# caller-supplied-command callee is a shell, and it tempts every caller into its own build --
# and the moment two callers build separately there are two binaries and this job has quietly
# stopped testing the thing it exists for, while still being green. That is not theoretical:
# on 2026-09-23 gym's runner and the development box produced IDENTICAL `build_digest` and
# DIFFERENT `engine_binary` -- same data, different compilation. One wheel, shared, is what
# makes "the same engine" a fact rather than an assumption.
#
# WHY IT EXISTS ONCE, HERE. Four copies of a cross-repo job is the vendored-copy drift problem
# with a build attached. It lives in the repo that produces the artefact.
#
# ONE PLATFORM ON PURPOSE. A wheel is platform-specific, so the consumers must run where it was
# built. Cross-platform is `suite.yml`'s job, which builds per OS and answers a different
# question: does this repo work on both. This one answers: do the four repos agree on one
# binary. A job that can go red for two unrelated reasons is a worse instrument than two jobs
# each red for one.
#
# AND HERE IS THE GAP THAT LEAVES, stated so a later reader does not read this green as wider
# than it is. What a green run here establishes is that the four repos agree ON LINUX. It says
# NOTHING about whether they agree on Windows, and a second platform's cross-repo agreement is
# therefore UNTESTED rather than fine. The difference matters because the drift this job exists
# to catch is per-binary: `suite.yml` builds its own wheel per OS and can see a repo break on
# Windows, but nothing anywhere builds a Windows wheel and hands it to three consumers, so a
# Windows-only disagreement between repos has no instrument in this project at all.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      # No `repository:`, so this is the commit that triggered the run rather than whatever
      # the default branch happens to be. A job that always builds main cannot answer anything
      # about the change being proposed, and would have been green for every branch that broke
      # the engine.
      - uses: actions/checkout@v4
        with:
          path: RoyaleSim
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable

      - name: the tools the README's install names
        run: python -m pip install maturin pytest hypothesis ruff numpy msgspec mypy

      # The README's stage 3. The copy line is what gives a runner the card table this project
      # is calibrated against; the 2018 table is built beside it because tests load it by name.
      - name: stage 3, generate the data files
        shell: bash
        working-directory: RoyaleSim
        run: |
          python tools/extract_arena.py
          python tools/extract_cards.py --vintage 2018
          cp data/derived/cards-15.535.json data/derived/cards.json
          python tools/extract_globals.py

      - name: build the wheel every consumer will install
        working-directory: RoyaleSim
        run: maturin build --release --out ../wheelhouse

      # THE ARTEFACT NAMES ITSELF. A downstream row that says a suite passed, without saying
      # which binary it passed against, cannot tell a data mismatch from a compilation one --
      # and those two have already been observed to disagree.
      - name: record what this engine is
        shell: bash
        run: |
          wheel=$(ls wheelhouse/*.whl | head -1)
          {
            echo "engine_commit=$(git -C RoyaleSim rev-parse HEAD)"
            echo "wheel=$(basename "$wheel")"
            echo "wheel_sha256=$(sha256sum "$wheel" | cut -d' ' -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY" > wheelhouse/ENGINE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: royalesim-wheel
          path: wheelhouse/
          if-no-files-found: error

  downstream:
    needs: engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Learn's addopts are `-m "not slow and not engine"`, so a naive pytest here would
          # DESELECT precisely the five engine-contract tests this job exists to give a home.
          # It would be green, it would look like success, and the five would still have run
          # nowhere. So its selection is explicit.
          - repo: RoyaleLearn
            args: -m engine
          - repo: RoyaleGym
            args: ""
          - repo: RoyaleViser
            args: ""
    steps:
      # THE WHOLE STACK, not the repo under test alone, and this is the fix for what run one
      # got wrong. Installing one repo against the wheel answers "does this repo import the
      # engine", which is a weaker question than the one asked here and, for two of the three
      # consumers, was not even that: learn's install failed for a missing sibling, and
      # viser's engine tests are all behind `importorskip("royalegym...")` so they SKIPPED and
      # the row went green having touched no engine code at all. README fidelity -- does the
      # documented install work from nothing -- is `suite.yml`'s question, per repo. This job's
      # question is whether the four repos agree on one binary, and a repo cannot disagree
      # with a binary its tests never reached.
      #
      # RoyaleSim is checked out by the DEFAULT action, with no `repository:`, so it arrives
      # at the commit that triggered this run. The three consumers arrive at their default
      # branches, which is the composition a user gets.
      - uses: actions/checkout@v4
        with:
          path: RoyaleSim
          fetch-depth: 0
      - uses: actions/checkout@v4
        with: { repository: RoyaleGym/RoyaleGym, path: RoyaleGym, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: RoyaleGym/RoyaleLearn, path: RoyaleLearn, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: RoyaleGym/RoyaleViser, path: RoyaleViser, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: royalesim-wheel
          path: wheelhouse

      # A MISSING WHEEL FAILS HERE, AND THIS IS THE ONE PLACE IN THIS PROJECT WHERE THAT IS
      # RIGHT. Everywhere else a missing dependency should skip and name its remedy. Here the
      # engine's presence IS the property under test, so a skip would convert the only job
      # that can see binary drift into a job that reports green having tested nothing.
      - name: the wheel must be here
        shell: bash
        run: |
          test -f wheelhouse/ENGINE.txt || { echo "no ENGINE.txt: the engine job did not publish"; exit 1; }
          ls wheelhouse/*.whl >/dev/null || { echo "no wheel in the artifact"; exit 1; }
          cat wheelhouse/ENGINE.txt >> "$GITHUB_STEP_SUMMARY"

      # The wheel FIRST and from a local path, so nothing downstream can resolve `royalesim`
      # off an index and quietly test a different binary. The siblings are installed from
      # source for the same reason: `royalelearn` requires `royalegym>=0.1.0`, which exists
      # on no index, so pip WILL go to PyPI and fail for anything it is not handed by path.
      - name: install that engine, then the stack around it
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl
          python -m pip install pytest hypothesis
          python -m pip install -e RoyaleGym -e RoyaleLearn -e "RoyaleViser[media]"

      - name: stage 3 for the data the consumers read
        shell: bash
        working-directory: RoyaleSim
        run: |
          python tools/extract_arena.py
          python tools/extract_cards.py --vintage 2018
          cp data/derived/cards-15.535.json data/derived/cards.json
          python tools/extract_globals.py

      # PLANT. THIS BRANCH IS NEVER MERGED.
      #
      # match.START_MANA is 6 in the ledger the wheel was built from. Moving it to 5 here --
      # after the build, on the disk the consumers read -- is the exact drift the stale-build
      # refusal exists to catch, and 5 is not a random number: it is the candidate the ledger
      # records and rejects, so this is a drift someone could really introduce.
      - name: PLANT, one calibration value moved after the wheel was built
        shell: bash
        working-directory: RoyaleSim
        run: |
          python - <<'PY'
          import io, json
          p = "data/calibration.json"
          d = json.loads(io.open(p, encoding="utf-8").read())
          assert d["match"]["START_MANA"]["value"] == 6, d["match"]["START_MANA"]["value"]
          d["match"]["START_MANA"]["value"] = 5
          io.open(p, "w", encoding="utf-8", newline="\n").write(json.dumps(d, indent=2) + "\n")
          print("PLANTED: match.START_MANA 6 -> 5 on disk, wheel still holds 6")
          PY

      # `-rs` is not decoration: the next step reads these lines. `tee` keeps the output for
      # it while pipefail keeps pytest's own exit code as this step's.
      - name: the suite, against that engine
        id: suite
        shell: bash
        working-directory: ${{ matrix.repo }}
        run: |
          set -o pipefail
          python -m pytest -q -rs ${{ matrix.args }} 2>&1 | tee "$GITHUB_WORKSPACE/pytest.txt"

      # THE GATE THAT MAKES THE ROW ABOVE MEAN SOMETHING. A consumer whose engine tests all
      # skip is GREEN, and it is green for the one reason this job may never accept: it did
      # not reach the engine. Run one shipped exactly that -- viser, a green row, zero engine
      # lines -- and nothing in the job could tell.
      #
      # It refuses a SHAPE rather than a list of known tests: any skip whose reason names the
      # engine is a failure HERE, whatever the test is called, because there is no such thing
      # as a legitimately absent engine in this job. Elsewhere those same skips are correct
      # and must stay.
      #
      # It is also the only instrument that would notice learn's
      # `except RuntimeError: pytest.skip("the engine build disagrees with the data on disk")`,
      # which converts the stale-build refusal -- the check that the data and the binary
      # match -- into a green skip in the one job built to test that they do.
      - name: a skip that names the engine is a failure here
        if: always()
        shell: bash
        run: |
          test -f pytest.txt || { echo "the suite step produced no output to read"; exit 1; }
          tail -3 pytest.txt >> "$GITHUB_STEP_SUMMARY"
          bad=$(grep -E "^SKIPPED" pytest.txt | grep -iE "royalesim|royalegym|extension|engine|core_available|maturin" || true)
          if [ -n "$bad" ]; then
            echo "SKIPPED FOR WANT OF THE ENGINE, in the job whose entire subject is the engine:"
            echo "$bad"
            echo "Every one of these is a test that did not run against the wheel this job built."
            echo "Either the stack install above no longer gives this repo what its tests import,"
            echo "or the engine refused to construct -- and a refusal is a RED here, never a skip."
            exit 1
          fi
          echo "no engine-shaped skips"

      # The engine's own digest, from the binary that just ran the suite, beside the count.
      - name: record what ran
        if: always()
        shell: bash
        run: |
          {
            echo "repo=${{ matrix.repo }}  pytest args='${{ matrix.args }}'"
            python -c "import royalesim; print('engine provenance=%s tree=%s' % royalesim.Battle.provenance())" || true
            cat wheelhouse/ENGINE.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # PLANT GRADING. This step is GREEN when the plant landed: the refusal reached the
      # consumer AND the suite went red for it. A skip carrying the same words is not a
      # landing -- it is the defect this job exists to refuse, and learn's engine fixture
      # has exactly that `except RuntimeError: pytest.skip(...)`.
      - name: PLANT GRADING, the refusal must be a failure and not a skip
        if: always()
        shell: bash
        env:
          SUITE: ${{ steps.suite.outcome }}
        run: |
          echo "suite step outcome: $SUITE"
          if ! grep -q "built against different data" pytest.txt; then
            echo "PLANT DID NOT LAND: the stale-build refusal is nowhere in the output."
            echo "The consumer ran against a wheel built from different data and did not notice."
            grep -E "^(SKIPPED|FAILED|ERROR)" pytest.txt | head -20
            exit 1
          fi
          if [ "$SUITE" != "failure" ]; then
            echo "PLANT LANDED AS A SKIP, NOT A FAILURE."
            echo "The refusal is in the output and the suite still exited green, so this"
            echo "consumer reports a data mismatch as a pass."
            grep -E "^SKIPPED" pytest.txt | head -20
            exit 1
          fi
          echo "PLANT LANDED: the engine refused, and the suite went red for that refusal."
          grep -m3 "built against different data" pytest.txt
